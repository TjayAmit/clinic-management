; PHP-FPM pool configuration for production
; Tune pm.max_children based on available RAM: (RAM - overhead) / ~30MB per worker

[www]
user  = www-data
group = www-data

listen = 0.0.0.0:9000

; Dynamic process management — scales workers based on demand
pm                   = dynamic
pm.max_children      = 20
pm.start_servers     = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
; Recycle workers after N requests to prevent memory leaks
pm.max_requests      = 500

; Surface PHP-FPM slow-log and error output to stderr so Docker captures it
php_admin_flag[log_errors]  = on
php_admin_value[error_log]  = /proc/self/fd/2
; Clear environment to avoid leaking host env vars into the pool
clear_env = no
