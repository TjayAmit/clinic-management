; Production PHP settings — mounted into the final image stage

[PHP]
; Increase limits for file uploads and API payloads
upload_max_filesize = 20M
post_max_size       = 25M
max_execution_time  = 60
memory_limit        = 256M

; Hide PHP version from response headers
expose_php = Off

[opcache]
opcache.enable                 = 1
opcache.memory_consumption     = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files  = 20000
opcache.revalidate_freq        = 0
; Disable file stat checks in production — cache is stable between deploys
opcache.validate_timestamps    = 0
opcache.fast_shutdown          = 1
