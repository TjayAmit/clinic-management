name: CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

# Prevent redundant runs: cancel in-progress runs for the same ref/branch
# when a new push arrives. On master we let them finish (no concurrency key).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: PHP quality — Pint lint check + Pest tests
  # Uses SQLite (default in .env.example / phpunit.xml) — no DB service needed.
  # ──────────────────────────────────────────────────────────────
  php:
    name: PHP checks (lint + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, redis
          tools: composer:v2
          # xdebug only needed if you want coverage; skip it to keep CI fast
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Create SQLite test database
        run: touch database/database.sqlite

      - name: Run migrations (SQLite)
        run: php artisan migrate --force

      # Pint in --test mode: exits non-zero if formatting violations exist
      - name: PHP lint (Pint)
        run: composer lint:check

      - name: Run Pest tests
        run: ./vendor/bin/pest --no-coverage

  # ──────────────────────────────────────────────────────────────
  # Job 2: Frontend quality — ESLint + TypeScript typecheck
  # ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend checks (lint + types)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: ESLint (check only, no auto-fix)
        run: npm run lint:check

      - name: TypeScript typecheck
        run: npm run types:check

  # ──────────────────────────────────────────────────────────────
  # Job 3: Build & push Docker image to GHCR
  # Only runs when BOTH php and frontend jobs pass.
  # Only builds on push events (not on pull_request) to avoid
  # pushing images from forks or unreviewed code.
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: [php, frontend]

    # Skip image push on pull requests — build only to validate the Dockerfile
    # On push to master, build + push. On PRs, build only (no push).
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only authenticate when we intend to push (i.e. on push events)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is automatically available — no secret to add
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Tag with the short git SHA for traceability (e.g. sha-a1b2c3d)
            type=sha,prefix=sha-,format=short
            # Also tag as 'latest' on pushes to master
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Push only on push events; on pull_request this is a build-only validation
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache for Docker layers — speeds up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
